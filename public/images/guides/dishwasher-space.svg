<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 280" role="img" aria-labelledby="title desc">
  <title id="title">조리대형도 문 앞 공간까지 재세요</title>
  <desc id="desc">위에서 본 개념도. 조리대의 본체 자리에서 열린 문이 통로로 나옵니다. 급수·배수 연결 경로도 따로 확인합니다. 실제 비율이나 설치 간격을 표시한 도면은 아닙니다.</desc>
  <g font-family="sans-serif" font-size="16" fill="#374151">
    <rect x="1" y="1" width="358" height="133" fill="#f3f4f6" stroke="#9ca3af"/>
    <text x="16" y="30">조리대 · 위에서 본 모습</text>
    <rect x="45" y="55" width="150" height="78" rx="3" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
    <text x="120" y="101" text-anchor="middle" fill="#1e3a8a">본체 자리</text>
    <path d="M195 91H234" fill="none" stroke="#4b5563" stroke-width="2" stroke-dasharray="5 5"/>
    <text x="244" y="82">급수·배수</text>
    <text x="244" y="108">연결 경로</text>
    <rect x="45" y="135" width="150" height="65" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
    <text x="120" y="174" text-anchor="middle" fill="#1e3a8a">열린 문</text>
    <path d="M25 216H335" fill="none" stroke="#6b7280" stroke-dasharray="4 5"/>
    <text x="180" y="250" text-anchor="middle">문 앞에 남아야 하는 통로</text>
  </g>
</svg>
