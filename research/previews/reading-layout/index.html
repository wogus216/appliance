<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>식기세척기 가이드 — 현재 화면과 개선 예상안</title>
<style>
header{position:sticky;top:0;z-index:2}
*{box-sizing:border-box}body{margin:0;background:#f3f4f6;color:#111827;font-family:system-ui,-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}header{padding:24px max(20px,calc((100vw - 1160px)/2));background:white;border-bottom:1px solid #d1d5db}h1{font-size:23px;line-height:1.4;margin:0;font-weight:750;letter-spacing:-.025em;word-break:keep-all}header p{color:#4b5563;font-size:14px;line-height:1.6;margin:8px 0 18px;max-width:75ch;word-break:keep-all}.controls{display:flex;align-items:center;gap:16px;flex-wrap:wrap}.group{display:flex;gap:4px;padding:3px;background:#f3f4f6;border-radius:9px}button{font:inherit;font-size:14px;color:#374151;min-height:44px;padding:8px 16px;border:0;border-radius:6px;background:transparent;cursor:pointer}button[aria-pressed=true]{background:#1d4ed8;color:white;font-weight:650}button:hover{background:#e5e7eb;color:#111827}button[aria-pressed=true]:hover{background:#1e40af;color:white}button:focus-visible,a:focus-visible{outline:2px solid #1d4ed8;outline-offset:3px}.jump{color:#1d4ed8;min-height:44px;display:inline-flex;align-items:center;font-size:14px;text-underline-offset:4px}main{max-width:1200px;margin:22px auto;padding:0 20px}#state{font-size:14px;color:#374151;margin:0 0 12px}iframe{display:block;border:1px solid #d1d5db;width:100%;height:1000px;background:white;margin:0 auto}iframe.mobile{width:390px;max-width:100%;height:844px}footer{max-width:1200px;margin:20px auto 32px;padding:0 20px;font-size:13px;color:#4b5563;line-height:1.7}::selection{background:#dbeafe;color:#1e3a8a}@media(max-width:600px){header{padding:20px 16px}h1{font-size:20px}main{padding:0 8px;margin-top:16px}.controls{gap:8px}button{padding:8px 12px}iframe{height:844px}.group{flex:0 0 auto}}
</style>
</head>
<body>
<header>
  <h1>식기세척기 가이드, 이렇게 바뀝니다</h1>
  <p>다음 구매 가이드의 가독성 개선 시안입니다. 기존 원고와 제품 사진으로 구성했으며, 아직 실제 가이드에는 반영하지 않았습니다.</p>
  <div class="controls">
    <div class="group" role="group" aria-label="비교할 화면">
      <button type="button" data-version="current" aria-pressed="false">현재 화면</button>
      <button type="button" data-version="proposed" aria-pressed="true">개선 예상안</button>
    </div>
    <div class="group" role="group" aria-label="화면 너비">
      <button type="button" data-size="desktop" aria-pressed="true">데스크톱</button>
      <button type="button" data-size="mobile" aria-pressed="false">모바일</button>
    </div>
    <a class="jump" href="dishwasher-proposed.html#proposal-heading" target="preview-frame">새 사진·표·도식부터 보기</a>
  </div>
</header>
<main>
  <p id="state" role="status">개선 예상안 · 데스크톱 — 사진 → 선택표 → 설치 도식 → 확인 순서</p>
  <iframe name="preview-frame" id="preview-frame" title="식기세척기 가이드 개선 예상안" src="dishwasher-proposed.html#proposal-heading"></iframe>
</main>
<footer>현재 화면은 이번 시안 작업 전의 로컬 정적 페이지입니다. 예상안의 설치 그림은 개념도이며 실측·설치 승인 자료가 아닙니다. 실제 기능은 연결된 기존 도구에서 확인할 수 있습니다.</footer>
<script>
const frame=document.getElementById('preview-frame');
frame.addEventListener('load',()=>requestAnimationFrame(()=>window.scrollTo(0,0)));
let version='proposed',size='desktop';
function render(){
  document.querySelectorAll('[data-version]').forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.version===version)));
  document.querySelectorAll('[data-size]').forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.size===size)));
  frame.classList.toggle('mobile',size==='mobile');
  frame.title='식기세척기 가이드 '+(version==='proposed'?'개선 예상안':'현재 화면');
  document.getElementById('state').textContent=(version==='proposed'?'개선 예상안':'현재 화면')+' · '+(size==='mobile'?'모바일':'데스크톱')+(version==='proposed'?' — 사진 → 선택표 → 설치 도식 → 확인 순서':' — 기존 제품 목록 → 상세 가이드');
}
document.querySelectorAll('[data-version]').forEach(button=>button.addEventListener('click',()=>{
  version=button.dataset.version;
  frame.src=version==='proposed'?'dishwasher-proposed.html#proposal-heading':'dishwasher-current.html#product-list';
  render();
}));
document.querySelectorAll('[data-size]').forEach(button=>button.addEventListener('click',()=>{size=button.dataset.size;render()}));
document.querySelector('.jump').addEventListener('click',()=>{version='proposed';render()});
</script>
</body>
</html>
